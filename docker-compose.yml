version: "3.8"



services:

  postgres:
  
    image: postgres:15-alpine
    
    container_name: fairmove-postgres
    
    restart: always
    
    environment:
    
      POSTGRES_DB: fairmove
      
      POSTGRES_USER: fairmove
      
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      
    volumes:
    
      - postgres_data:/var/lib/postgresql/data
      
    ports:
    
      - "5432:5432"
      


  redis:
  
    image: redis:7-alpine
    
    container_name: fairmove-redis
    
    restart: always
    
    ports:
    
      - "6379:6379"
      
    volumes:
    
      - redis_data:/data
      


  backend:
  
    build: .
    
    container_name: fairmove-backend
    
    restart: always
    
    depends_on:
    
      - postgres
      
      - redis
      
    environment:
    
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      
      REDIS_URL: redis://redis:6379
      
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      
      JWT_EXPIRES_IN: 1d
      
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?Set REFRESH_TOKEN_SECRET in .env}
      
      REFRESH_TOKEN_EXPIRES_IN: 30d
      
      NODE_ENV: development
      
      PORT: 3000
      
    ports:
    
      - "3000:3000"
      
    volumes:
    
      - .:/usr/src/app
      


volumes:

  postgres_data:
  
  redis_data:
  










































