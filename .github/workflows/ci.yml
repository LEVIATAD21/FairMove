name: FairMove CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://fairmove:fairmove_password@localhost:5432/fairmove
      NODE_ENV: test

    services:
      postgres:
        image: postgis/postgis:15-3.5-alpine
        env:
          POSTGRES_USER: fairmove
          POSTGRES_PASSWORD: fairmove_password
          POSTGRES_DB: fairmove
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ephemeral test secrets only; never production credentials.
      - name: Generate ephemeral test secrets
        shell: bash
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "REFRESH_TOKEN_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Enable PostGIS extension
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Verify required tables exist
        shell: bash
        run: |
          result="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT CASE WHEN to_regclass('public.users') IS NOT NULL AND to_regclass('public.wallets') IS NOT NULL AND to_regclass('public.rides') IS NOT NULL THEN 'ok' ELSE 'missing' END")"
          test "$result" = "ok" || { echo "Required schema missing after db:migrate"; exit 1; }

      - name: Run tests
        run: pnpm test

      - name: Validate Expo app and EAS build configuration
        run: |
          node --check apps/passenger/app.config.js
          node --check apps/driver/app.config.js
          node -e "const fs=require('node:fs'); for (const f of ['apps/passenger/app.json','apps/driver/app.json','apps/passenger/eas.json','apps/driver/eas.json']) JSON.parse(fs.readFileSync(f,'utf8'))"

      - name: Bundle production Android apps
        env:
          EAS_BUILD_PROFILE: production
          EXPO_PUBLIC_API_URL: https://ci.fairmove.invalid/api/v1
        run: |
          pnpm --filter passenger exec expo export --platform android --output-dir /tmp/fairmove-passenger-export
          pnpm --filter driver exec expo export --platform android --output-dir /tmp/fairmove-driver-export

      - name: Build TypeScript
        run: pnpm build

  docker:
    name: Build and test Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: fairmove_ci_password
          REDIS_PASSWORD: fairmove_ci_password
          DATABASE_URL: postgres://fairmove:fairmove_ci_password@postgres:5432/fairmove
          JWT_SECRET: ci_only_jwt_secret_012345678901234567890123456789012345678901234567890123456789
          REFRESH_TOKEN_SECRET: ci_only_refresh_secret_012345678901234567890123456789012345678901234567890123456789
          CORS_ORIGIN: https://ci.fairmove.invalid
        run: docker compose config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build only: publishing images requires a separately configured release workflow.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: fairmove:ci
