name: FairMove CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://fairmove:fairmove_password@localhost:5432/fairmove
      NODE_ENV: test

    services:
      postgres:
        image: postgres:15.19-alpine
        env:
          POSTGRES_USER: fairmove
          POSTGRES_PASSWORD: fairmove_password
          POSTGRES_DB: fairmove
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Segredos de teste nunca hardcoded no workflow: gerados por execução
      # (>=64 chars, distintos entre si), descartados ao fim do job.
      - name: Generate ephemeral test secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "REFRESH_TOKEN_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      # Testes de integração (ledger, auth, rides, WS) rodam contra o
      # Postgres do serviço acima; schema aplicado por push.
      - name: Apply database schema
        run: pnpm db:push

      - name: Run tests
        run: pnpm test

      - name: Build TypeScript
        run: pnpm build

  docker:
    name: Build and test Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: false
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: false
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: fairmove:latest
