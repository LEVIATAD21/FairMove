packages:
  - packages/*
  - apps/*
allowBuilds:
  bcrypt: true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.20'
  - '@expo/env@2.4.3'
  - '@expo/fingerprint@0.20.11'
  - '@expo/metro-config@57.0.12'
  - expo-constants@57.0.16
  - expo-font@57.0.2
  - expo@57.0.18

overrides:
  react: 19.2.3
  # CVEs corrigidas (pnpm audit): qs DoS no parsing de query do Express,
  # morgan log forging, js-yaml CPU DoS (toolchain), decode-uri-component DoS.
  qs: 6.16.0
  morgan: 1.12.0
  js-yaml: 3.15.2
  decode-uri-component: 0.5.0
